[package]
name = "beholder-server"
description = "Beholder server: auth, campaigns, event log, sync, images."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
beholder-core.workspace = true
beholder-protocol = { workspace = true, features = ["codec"] }
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
image.workspace = true
postcard.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v7", "std"] }
webp.workspace = true
zstd.workspace = true
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
beholder-dnd-data.workspace = true
serde_json = "1.0.154"
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
