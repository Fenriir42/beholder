[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/server",
    "crates/client-core",
    "crates/e2e",
    "apps/desktop/ipc",
    "apps/desktop/ui",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
beholder-core = { path = "crates/core" }
beholder-protocol = { path = "crates/protocol" }
beholder-server = { path = "crates/server" }
beholder-client-core = { path = "crates/client-core" }
beholder-ipc = { path = "apps/desktop/ipc" }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
fastrand = "2.5.0"
getrandom = { version = "0.4.3", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3"
tokio = { version = "1.53.2", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls-no-default"] }
webp = { version = "0.3.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = { version = "0.14.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Dev: fast builds on a weak laptop. Our crates at 0, dependencies at 1,
# a few hot dependencies at 2 so tests (hashing, image decode, zstd) stay quick.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

# Client and WASM: optimise for size (SPEC §2).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Server: optimise for speed, keep unwinding so one panicking task can't kill it.
[profile.server]
inherits = "release"
opt-level = 3
panic = "unwind"
