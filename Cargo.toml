[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
beholder-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Dev: fast builds on a weak laptop. Our crates at 0, dependencies at 1,
# a few hot dependencies at 2 so tests (hashing, image decode, zstd) stay quick.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

# Client and WASM: optimise for size (SPEC §2).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Server: optimise for speed, keep unwinding so one panicking task can't kill it.
[profile.server]
inherits = "release"
opt-level = 3
panic = "unwind"
