name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the .deb/.rpm compatible with older glibc.
          - os: ubuntu-22.04
            bundles: deb,rpm
          - os: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: trunk@0.21.14,tauri-cli@2.12.2
      - name: Bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Size report
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo "| Artifact | Bytes |"
            echo "|---|---:|"
            find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \) \
              -exec sh -c 'printf "| %s | %s |\n" "$(basename "$1")" "$(wc -c < "$1")"' _ {} \;
            wasm=$(find apps/desktop/ui/dist -name '*.wasm' | head -1)
            echo "| UI WASM | $(wc -c < "$wasm") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*-setup.exe
