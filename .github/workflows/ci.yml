name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri's system libraries, needed to compile the desktop shell.
  TAURI_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $TAURI_DEPS
      # rust-toolchain.toml makes rustup install the pinned toolchain and wasm target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      # tauri::generate_context! needs the frontend dir to exist; the real UI is built in `size`.
      - run: mkdir -p apps/desktop/ui/dist && echo '<!doctype html>' > apps/desktop/ui/dist/index.html
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: SRD bundle matches vendored data
        run: cargo run --locked -q -p beholder-xtask -- srd --check
      - name: wasm32 compatibility
        run: cargo check --locked -p beholder-core -p beholder-protocol -p beholder-ui --target wasm32-unknown-unknown

  size:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: size
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: trunk@0.21.14
      - name: Build UI (release, wasm-opt -Oz)
        working-directory: apps/desktop/ui
        run: trunk build --release --locked
      - name: Build server (server profile)
        run: cargo build --locked --profile server -p beholder-server
      - name: Size report
        run: |
          wasm=$(find apps/desktop/ui/dist -name '*.wasm' | head -1)
          {
            echo "### Sizes"
            echo "| Artifact | Bytes | gzip |"
            echo "|---|---:|---:|"
            echo "| UI WASM (after wasm-opt) | $(stat -c %s "$wasm") | $(gzip -9c "$wasm" | wc -c) |"
            echo "| UI dist total | $(du -sb apps/desktop/ui/dist | cut -f1) | |"
            echo "| Server binary | $(stat -c %s target/server/beholder-server) | |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
